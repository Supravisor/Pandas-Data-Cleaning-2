
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pandas Data Cleaning 2</title>
  <link href="./styles.css" rel="stylesheet" />
</head>

<body>

  <h1>Pandas - Data Cleaning 2</h1>

  <form name="editor">
    <table>
      <tbody>
        <tr>
          <td id="buttons">
            <div>
<h2>Import modules</h2>

<p>
  <input type="button" class="btn btn-module" value="pandas" onclick="document.editor.textbox.value+='\nimport pandas as pd'" />
  <input type="button" class="btn btn-module" value="numpy" onclick="document.editor.textbox.value+='\nimport numpy as np'" />
  <input type="button" class="btn btn-module" value="version" onclick="document.editor.textbox.value+='\nprint(np.__version__)'" />
</p>

<hr />
<h2>Find unique values</h2>

<p>
  <input class="btn" name="variableUnique" id="variableUnique" placeholder="variable" type="textfield" />
  <input class="btn" name="columnUnique" id="columnUnique" placeholder="column" type="textfield" />
</p>

<p>
  <input type="button" class="btn btn-success" value="unique()" onclick="unique(this.value);" />
  <input type="button" class="btn btn-success" value="value_counts()" onclick="unique(this.value);" />
</p>

<h3>Replace values</h3>

<p>
  <input type="button" class="btn btn-success" value="replace" onclick="replace(this.value);" />
  <input type="button" class="btn btn-success" value="dictionary" onclick="replaceDictionary();" />
  <input type="button" class="btn btn-success" value="DataFrame" onclick="replaceDataFrame();" />
</p>

<p>
  <input class="btn" name="oldValue" id="oldValue" placeholder="old value" type="textfield" />
  <input class="btn" name="newValue" id="newValue" placeholder="new value" type="textfield" />
</p>

<p>
  <input type="button" class="btn btn-success" value="age limit" onclick="ageLimit();" />
</p>

<h3>Series duplicates</h3>

<p>
  <input type="button" class="btn btn-success" value="duplicated" onclick="duplicateSeries(this.value);" />
  <input type="button" class="btn btn-success" value="drop_duplicates" onclick="duplicateSeries(this.value);" />
  <select name="duplicateKeepSeries">
    <option value=""></option>
    <option value="'last'">last</option>
    <option value="False">False</option>
  </select>
</p>

<h3>DataFrame duplicates</h3>

<p>
  <input type="button" class="btn btn-success" value="duplicated" onclick="duplicateDataFrame(this.value);" />
  <input type="button" class="btn btn-success" value="drop_duplicates" onclick="duplicateDataFrame(this.value);" />
</p>

<p>
  <input class="btn" name="duplicateSubset" id="duplicateSubset" placeholder="subset" type="textfield" />
  <select name="duplicateKeepDataFrame">
    <option value=""></option>
  </select>
</p>

            </div>
          </td>
          <td id="textbox">
            <textarea id="preview" name="textbox"></textarea>
          </td>
          <td id="empty"></td>
        </tr>
      </tbody>
    </table>
  </form>

  <script src="./script.js"></script>

</body>
</html>
